    bioMy: "တစ်ချိန်တည်းမှာ လမ်းနှစ်ခွမှာ တွေးနိုင်သူ။ ဘယ်လောက်ခရီးရောက်ပြီးပြီလဲ၊ ဘယ်လောက်ကျန်သေးမလဲဆိုတာကို နှစ်ခုစလုံး ချိန်ညှိစဉ်းစားတယ်။ ခြေလှမ်းတိုင်းမှာ နှစ်ခုစလုံးကို ချိန်ညှိထားတဲ့အတွက် များသောအားဖြင့် ခရီးဆုံးကို မြန်မြန်နဲ့ တကယ့်အသက်သာဆုံးလမ်း နှစ်ခုစလုံးနဲ့ ရောက်တတ်တယ်။ ကိုချွေတာရဲ့ သေချာမှုနဲ့ ကိုစိတ်မြန်ရဲ့ မြန်ဆန်မှုကို ပေါင်းစပ်ထားသလိုပါပဲ။",
    mechEn: "At each step, he adds up the real cost travelled so far with an estimate of the distance still remaining, and picks whichever city gives the smallest combined total. As long as his estimate never overpromises, this guarantees he finds the cheapest route of all.",
    mechMy: "ခြေလှမ်းတိုင်းမှာ၊ အခုအထိ တကယ်ကုန်ကျခဲ့တဲ့ အကွာအဝေးနဲ့ ကျန်ရှိနေဦးမယ်လို့ ခန့်မှန်းထားတဲ့ အကွာအဝေးကို ပေါင်းပြီး၊ ပေါင်းလဒ် အနည်းဆုံးဖြစ်တဲ့ မြို့ကို ရွေးတယ်။ ခန့်မှန်းချက်က တကယ့်ကုန်ကျမှုထက် ဘယ်တော့မှ မပိုအောင် ခန့်မှန်းနိုင်သရွေ့၊ ဒါက အသက်သာဆုံးလမ်းကို အာမခံပေးတယ်။"
  },
];

const rows = document.getElementById('rows');
function render(lang) {
  rows.innerHTML = '';
  companions.forEach(c => {
    const row = document.createElement('div');
    row.className = 'companion-row';
    row.innerHTML = `
      <div class="portrait-lg" style="background:${c.color}33">
        <img src="${c.img}" alt="${c.my}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="fallback" style="background:${c.color}">${c.my[1]}</div>
      </div>
      <div class="companion-text">
        <div class="tag sans">${c.en.split(' · ')[0]}</div>
        <div class="names">
          <span class="my-name">${c.my}</span>
          <span class="en-name sans">${c.en}</span>
        </div>
        <p class="bio">${lang === 'my' ? c.bioMy : c.bioEn}</p>
      </div>
    `;
    rows.appendChild(row);
  });
}
render('en');

document.getElementById('langBtn').addEventListener('click', function() {
  this.dataset.lang = this.dataset.lang === 'my' ? 'en' : 'my';
  const lang = this.dataset.lang || 'my';
  this.textContent = lang === 'my' ? 'English' : 'မြန်မာ';
  const titles = {
    en: { title: "Six companions, six ways of thinking", lead: "Each travel companion searches for a route in their own way. Meet them here, then pick one on the map to see how they think." },
    my: { title: "အဖော် ခြောက်ယောက်၊ တွေးခေါ်ပုံ ခြောက်မျိုး", lead: "ခရီးအတူသွားမည့်သူ တစ်ယောက်စီက လမ်းကြောင်းကို မတူညီတဲ့နည်းနဲ့ ရှာဖွေသည်။ ဤနေရာတွင် သူတို့ကို စတင်မိတ်ဆက်ပြီး၊ မြေပုံပေါ်တွင် တစ်ယောက်ကို ရွေးချယ်ကြည့်ပါ။" }
  };
  document.getElementById('pageTitle').textContent = titles[lang].title;
  document.getElementById('pageLead').textContent = titles[lang].lead;
  render(lang);
});
</script>
</body>
</html>
